    .item-card { border:3px solid var(--ink); border-radius:22px; padding:12px; background:var(--white); }

  <script>
    const trip = JSON.parse(document.getElementById('trip-data').textContent);
    const $ = (s, root=document) => root.querySelector(s);
    const $$ = (s, root=document) => [...root.querySelectorAll(s)];
    const typeLabel = { flight:'飞机', rail:'高铁', walk:'散步', local:'交通', spot:'景点', food:'美食', note:'备注', sleep:'住宿' };
    const typeIcon = { flight:'✈️', rail:'🚄', walk:'🚶', local:'🧭', spot:'📍', food:'🥢', note:'📝', sleep:'🛏️' };
    const fmt = text => String(text || '').replace(/\n/g, '<br>');
    function updateCountdown() {
      const target = new Date(trip.departure).getTime();
      const diff = Math.max(0, target - Date.now());
      const d = Math.floor(diff / 86400000), h = Math.floor(diff / 3600000) % 24, m = Math.floor(diff / 60000) % 60, s = Math.floor(diff / 1000) % 60;
      $('#countdown').innerHTML = [['天',d],['时',h],['分',m],['秒',s]].map(([label,val]) => `<div class="countbox"><b>${String(val).padStart(2,'0')}</b><span>${label}</span></div>`).join('');
    }
    function renderFlights() {
      $('#flightCount').textContent = `${trip.flights.length} 段记录`;
      $('#flightGrid').innerHTML = trip.flights.map((f,i) => `<article class="card flight"><div class="flight-top"><span class="tag flight">${f.kind}</span><strong>${f.date}</strong></div><pre>${f.text}</pre><small>${f.city || '移动日'}</small></article>`).join('');
    }
    let active = Number(localStorage.getItem('trip-active-day') || 0);
    function renderTabs() {
      $('#dateTabs').innerHTML = trip.days.map((d,i) => `<button class="date-tab ${i===active?'active':''}" role="tab" aria-selected="${i===active}" data-i="${i}"><strong>${d.date.split(' ')[0]}</strong><br><small>${d.city || '移动'}</small></button>`).join('');
      $$('.date-tab').forEach(btn => btn.addEventListener('click', () => { active = Number(btn.dataset.i); localStorage.setItem('trip-active-day', active); renderTabs(); renderDay(true); }));
    }
    function renderDay(pop=false) {
      const d = trip.days[active];
      const panel = $('#dayPanel');
      panel.innerHTML = `<div class="card day-summary ${pop?'pop':''}"><span class="pill">${d.date}</span><h3>${d.city || '移动日'}</h3><p>${d.hotel ? `今晚住：${d.hotel}` : '今天以移动为主。'} ${d.hotelCost ? `｜${d.hotelCost}` : ''}</p></div><div class="timeline">${d.timeline.map(item => `<div class="item"><div class="dot"></div><article class="item-card"><div class="item-title"><span class="tag ${item.type}">${typeIcon[item.type] || '•'} ${item.time || typeLabel[item.type]}</span>${item.must ? '<span class="tag must">必去</span>' : ''}<strong>${fmt(item.title)}</strong></div>${item.details ? `<p class="details">${fmt(item.details)}</p>` : ''}</article></div>`).join('')}</div>`;
      if (pop) panel.animate?.([{transform:'scale(.985)', opacity:.82}, {transform:'scale(1)', opacity:1}], {duration:260, easing:'cubic-bezier(.2,1.5,.35,1)'});
    }
    const todos = ['确认护照、签证与入境资料', '准备 eSIM / 国际漫游', '下载日本与台湾交通 App', '整理航班、酒店、会员号码截图', '预约热门餐厅与展览门票', '带转换插头、行动电源、雨具', '准备日币、台币与备用信用卡', '出发前检查家中电器与垃圾'];
    function renderTodos() {
      const saved = JSON.parse(localStorage.getItem('trip-todos') || '{}');
      $('#todoList').innerHTML = todos.map((t,i) => `<label class="todo"><input type="checkbox" data-i="${i}" ${saved[i]?'checked':''}><span>${t}</span></label>`).join('');
      $$('#todoList input').forEach(input => input.addEventListener('change', () => { const state = JSON.parse(localStorage.getItem('trip-todos') || '{}'); state[input.dataset.i] = input.checked; localStorage.setItem('trip-todos', JSON.stringify(state)); }));
    }
    function renderHotels() {
      const seen = new Set();
      const rows = trip.days.filter(d => d.hotel || d.city).map(d => { const key = `${d.date}-${d.hotel}-${d.city}`; if(seen.has(key)) return ''; seen.add(key); return `<div class="hotel-row"><strong>${d.date}</strong><div>${d.hotel ? `<b>${d.hotel}</b>` : '<b>移动日</b>'}<br><span>${d.city || ''}</span>${d.hotelCost ? `<br><small>${d.hotelCost}</small>` : ''}</div></div>`; }).join('');
      $('#hotelList').innerHTML = rows;
    }
    updateCountdown(); setInterval(updateCountdown, 1000);
    renderFlights(); renderTabs(); renderDay(); renderTodos(); renderHotels();
  </script>
